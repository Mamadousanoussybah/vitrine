<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio - Mamadou Sanoussy Bah</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #333;
        }

        .portfolio {
            min-height: 100vh;
            padding: 70px 30px;
            text-align: center;
        }

        .portfolio h1 {
            margin: 0 0 10px;
            color: #1e3a5f;
            font-size: 38px;
        }

        .portfolio h2 {
            margin: 0 0 40px;
            font-size: 20px;
            font-weight: normal;
            color: #555;
        }

        .projects-container {
            max-width: 1000px;
            margin: 0 auto;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;

            gap: 18px;
        }

        .btn {
            display: inline-block;

            min-width: 220px;
            padding: 16px 24px;

            background: #1e3a5f;
            color: white;

            text-decoration: none;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            background: #16304d;
            transform: translateY(-4px);

            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        @media screen and (max-width: 768px) {

            .portfolio {
                padding: 45px 20px;
            }

            .portfolio h1 {
                font-size: 30px;
            }

            .projects-container {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 90%;
                max-width: 380px;
            }
        }
    </style>
</head>

<body>

    <main class="portfolio">

        <h1>Mamadou Sanoussy Bah</h1>

        <div class="projects-container">

            >
                Marketing Numérique
            </a>

            <a
